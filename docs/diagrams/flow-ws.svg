<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 800 600"
     font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',sans-serif">
  <rect width="800" height="600" fill="#ffffff"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#8a9a92" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="40" y="26" width="6" height="26" rx="3" fill="#0e7a50"/>
  <text x="58" y="40" font-size="22" font-weight="700" fill="#1c2a24" dominant-baseline="central">WebSocket 私信流程</text>
  <text x="58" y="66" font-size="12.5" fill="#8a9a92" dominant-baseline="central">为什么不用轮询：长连接毫秒送达；消息先入库再推送，离线也不丢</text>
<rect x="40" y="96" width="280" height="56" rx="10" fill="#eef7f2" stroke="#cfe7db" stroke-width="0.6"/>
  <text x="180.0" y="115.0" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="600" fill="#1c2a24">客户端建立连接</text>
  <text x="180.0" y="134.0" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#4a5a52">/ws/chat?token=JWT</text>
  <path d="M180 152 L180 191" fill="none" stroke="#8a9a92" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="40" y="196" width="280" height="56" rx="10" fill="#eef7f2" stroke="#cfe7db" stroke-width="0.6"/>
  <text x="180.0" y="215.0" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="600" fill="#1c2a24">握手时校验</text>
  <text x="180.0" y="234.0" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#4a5a52">token 有效且账号未禁用</text>
  <rect x="440" y="202" width="320" height="44" rx="10" fill="#fdecea" stroke="#f7c1c1" stroke-width="0.6"/>
  <text x="600.0" y="224.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#b91c1c">校验失败 → 关闭连接</text>
  <path d="M320 224 L435 224" fill="none" stroke="#8a9a92" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M180 252 L180 291" fill="none" stroke="#8a9a92" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="40" y="296" width="280" height="56" rx="10" fill="#eef7f2" stroke="#cfe7db" stroke-width="0.6"/>
  <text x="180.0" y="315.0" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="600" fill="#1c2a24">客户端发 CHAT 帧</text>
  <text x="180.0" y="334.0" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#4a5a52">type / toUserId / content</text>
  <path d="M180 352 L180 391" fill="none" stroke="#8a9a92" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="40" y="396" width="280" height="56" rx="10" fill="#eef7f2" stroke="#cfe7db" stroke-width="0.6"/>
  <text x="180.0" y="415.0" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="600" fill="#1c2a24">服务端先落库</text>
  <text x="180.0" y="434.0" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#4a5a52">t_chat_message 插入成功</text>
  <path d="M180 452 L180 491" fill="none" stroke="#8a9a92" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="40" y="496" width="280" height="56" rx="10" fill="#eef7f2" stroke="#cfe7db" stroke-width="0.6"/>
  <text x="180.0" y="515.0" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="600" fill="#1c2a24">推送对端 + 回 ACK</text>
  <text x="180.0" y="534.0" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#4a5a52">在线秒达，多端同时收</text>
  <text x="40" y="578" font-size="12.5" fill="#8a9a92" dominant-baseline="central">对端离线：上线后通过 REST 拉历史消息 —— 「先落库再推送」保证消息不丢</text>
</svg>