<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfaf7"/>
      <stop offset="1" stop-color="#eef4f0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0e7a50"/>
      <stop offset="1" stop-color="#2fa06d"/>
    </linearGradient>
    <filter id="cardShadow" x="-6%" y="-10%" width="112%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#1c2a24" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a9a92"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- 标题 -->
  <rect x="64" y="52" width="8" height="34" rx="4" fill="url(#accent)"/>
  <text x="88" y="78" font-size="30" font-weight="700" fill="#1c2a24">系统架构设计</text>
  <text x="88" y="104" font-size="14" fill="#7a8a82">Brix Campus Market · 前后端分离 · Spring Boot 3 + Vue 3 · 本地开发态双进程</text>

  <!-- ================= 客户端列 ================= -->
  <g filter="url(#cardShadow)">
    <rect x="64" y="150" width="360" height="640" rx="18" fill="#ffffff" stroke="#e3ebe6"/>
  </g>
  <rect x="64" y="150" width="360" height="46" rx="18" fill="#f0f6f2"/>
  <rect x="64" y="178" width="360" height="18" fill="#f0f6f2"/>
  <text x="88" y="180" font-size="15" font-weight="700" fill="#0e7a50">客户端层 · 浏览器（≥1280px）</text>

  <g font-size="13">
    <rect x="88" y="214" width="312" height="64" rx="12" fill="#f8faf9" stroke="#e3ebe6"/>
    <text x="104" y="240" font-size="14" font-weight="600" fill="#1c2a24">Vue 3 + TypeScript</text>
    <text x="104" y="262" font-size="12" fill="#7a8a82">Vite 7 · Element Plus · Pinia · Vue Router</text>

    <rect x="88" y="290" width="312" height="56" rx="12" fill="#f8faf9" stroke="#e3ebe6"/>
    <text x="104" y="314" font-size="13" font-weight="600" fill="#1c2a24">视图层 views / 组件 components</text>
    <text x="104" y="333" font-size="12" fill="#7a8a82">首页 · 详情 · 发布 · 收银台 · 订单 · 私信 · 个人中心</text>

    <rect x="88" y="358" width="312" height="56" rx="12" fill="#f8faf9" stroke="#e3ebe6"/>
    <text x="104" y="382" font-size="13" font-weight="600" fill="#1c2a24">状态与请求</text>
    <text x="104" y="401" font-size="12" fill="#7a8a82">Pinia(auth) · Axios 拦截器 · 统一 R 解包</text>

    <rect x="88" y="426" width="312" height="56" rx="12" fill="#f8faf9" stroke="#e3ebe6"/>
    <text x="104" y="450" font-size="13" font-weight="600" fill="#1c2a24">实时通信</text>
    <text x="104" y="469" font-size="12" fill="#7a8a82">WebSocket 客户端（私信推送 · 自动重连）</text>
  </g>

  <!-- 客户端特色 -->
  <g font-size="12">
    <rect x="88" y="500" width="146" height="40" rx="20" fill="#eef7f2" stroke="#cfe7db"/>
    <text x="161" y="525" text-anchor="middle" fill="#0e7a50" font-weight="600">游客模式</text>
    <rect x="244" y="500" width="156" height="40" rx="20" fill="#eef7f2" stroke="#cfe7db"/>
    <text x="322" y="525" text-anchor="middle" fill="#0e7a50" font-weight="600">微信扫码沙箱</text>
    <rect x="88" y="550" width="146" height="40" rx="20" fill="#fff3e8" stroke="#f6d9bd"/>
    <text x="161" y="575" text-anchor="middle" fill="#b25e00" font-weight="600">支付沙箱</text>
    <rect x="244" y="550" width="156" height="40" rx="20" fill="#fff3e8" stroke="#f6d9bd"/>
    <text x="322" y="575" text-anchor="middle" fill="#b25e00" font-weight="600">iMessage 聊天</text>
  </g>

  <!-- 网络 -->
  <g>
    <rect x="464" y="410" width="104" height="88" rx="14" fill="#ffffff" stroke="#e3ebe6" filter="url(#cardShadow)"/>
    <text x="516" y="442" text-anchor="middle" font-size="13" font-weight="700" fill="#1c2a24">Vite 代理</text>
    <text x="516" y="462" text-anchor="middle" font-size="11" fill="#7a8a82">:5173</text>
    <text x="516" y="480" text-anchor="middle" font-size="11" fill="#7a8a82">/api /uploads /ws</text>
  </g>

  <!-- ================= 服务端 ================= -->
  <g filter="url(#cardShadow)">
    <rect x="600" y="150" width="620" height="640" rx="18" fill="#ffffff" stroke="#dce7e1"/>
  </g>
  <rect x="600" y="150" width="620" height="46" rx="18" fill="url(#accent)"/>
  <rect x="600" y="178" width="620" height="18" fill="url(#accent)"/>
  <text x="624" y="180" font-size="15" font-weight="700" fill="#ffffff">服务端 · Spring Boot 3.5 :8080（单体分层）</text>

  <!-- Security 层 -->
  <g font-size="12">
    <rect x="624" y="212" width="572" height="52" rx="10" fill="#f6f9f7" stroke="#dce7e1"/>
    <text x="640" y="234" font-size="13" font-weight="700" fill="#1c2a24">Security 层</text>
    <text x="640" y="252" fill="#7a8a82">JWT 过滤器 · BCrypt · 公开路由(/auth /items GET /categories) vs 登录态</text>

    <!-- Controller -->
    <rect x="624" y="278" width="572" height="118" rx="10" fill="#f6f9f7" stroke="#dce7e1"/>
    <text x="640" y="300" font-size="13" font-weight="700" fill="#1c2a24">Controller 层 · 11 个控制器 / 42 个端点</text>
    <g fill="#0e7a50">
      <rect x="640" y="312" width="76" height="30" rx="8" fill="#eef7f2"/><text x="678" y="332" text-anchor="middle">Auth</text>
      <rect x="724" y="312" width="76" height="30" rx="8" fill="#eef7f2"/><text x="762" y="332" text-anchor="middle">User</text>
      <rect x="808" y="312" width="76" height="30" rx="8" fill="#eef7f2"/><text x="846" y="332" text-anchor="middle">Item</text>
      <rect x="892" y="312" width="86" height="30" rx="8" fill="#eef7f2"/><text x="935" y="332" text-anchor="middle">Order</text>
      <rect x="986" y="312" width="86" height="30" rx="8" fill="#eef7f2"/><text x="1029" y="332" text-anchor="middle">Comment</text>
      <rect x="1080" y="312" width="100" height="30" rx="8" fill="#eef7f2"/><text x="1130" y="332" text-anchor="middle">Category</text>
      <rect x="640" y="350" width="76" height="30" rx="8" fill="#eef7f2"/><text x="678" y="370" text-anchor="middle">Chat</text>
      <rect x="724" y="350" width="86" height="30" rx="8" fill="#eef7f2"/><text x="767" y="370" text-anchor="middle">Favorite</text>
      <rect x="818" y="350" width="76" height="30" rx="8" fill="#eef7f2"/><text x="856" y="370" text-anchor="middle">AI</text>
      <rect x="902" y="350" width="86" height="30" rx="8" fill="#eef7f2"/><text x="945" y="370" text-anchor="middle">Upload</text>
      <rect x="996" y="350" width="86" height="30" rx="8" fill="#eef7f2"/><text x="1039" y="370" text-anchor="middle">Report</text>
    </g>

    <!-- Service -->
    <rect x="624" y="410" width="572" height="128" rx="10" fill="#f6f9f7" stroke="#dce7e1"/>
    <text x="640" y="432" font-size="13" font-weight="700" fill="#1c2a24">Service 层 · 业务与事务边界</text>
    <g fill="#7a8a82">
      <rect x="640" y="444" width="264" height="40" rx="8" fill="#ffffff" stroke="#e3ebe6"/>
      <text x="652" y="461" font-size="12" font-weight="600" fill="#1c2a24">订单事务（3 个边界）</text>
      <text x="652" y="477" font-size="11">pay 抢占商品 CAS · cancel 回滚在售 · confirm 托管结算</text>
      <rect x="916" y="444" width="264" height="40" rx="8" fill="#ffffff" stroke="#e3ebe6"/>
      <text x="928" y="461" font-size="12" font-weight="600" fill="#1c2a24">发布合规两道闸</text>
      <text x="928" y="477" font-size="11">违禁词表 → AI 审核员（AI 故障降级放行）</text>
      <rect x="640" y="492" width="264" height="36" rx="8" fill="#ffffff" stroke="#e3ebe6"/>
      <text x="652" y="515" font-size="11.5">留言已读 · 收藏幂等 · 浏览去重(内存分页)</text>
      <rect x="916" y="492" width="264" height="36" rx="8" fill="#ffffff" stroke="#e3ebe6"/>
      <text x="928" y="515" font-size="11.5">两阶段估价 · 文案生成 · 每日额度</text>
    </g>

    <!-- AI 模块 -->
    <rect x="624" y="552" width="276" height="106" rx="10" fill="#fdf7ef" stroke="#f2ddc0"/>
    <text x="640" y="574" font-size="13" font-weight="700" fill="#b25e00">AI 模块 · LangChain4j</text>
    <text x="640" y="594" font-size="11.5" fill="#8a6a45">估价：LLM 新品价锚点 → 工具查成交库</text>
    <text x="640" y="612" font-size="11.5" fill="#8a6a45">同款样本核对 → 原价硬钳制 ≤ 原价×0.98</text>
    <text x="640" y="630" font-size="11.5" fill="#8a6a45">审核：四选一判定 · 文案：分类三段式</text>
    <text x="640" y="648" font-size="11.5" font-weight="600" fill="#b25e00">ObjectProvider 可选装配 · 无 Key 自动降级</text>

    <!-- 基础设施 -->
    <rect x="916" y="552" width="280" height="106" rx="10" fill="#f6f9f7" stroke="#dce7e1"/>
    <text x="932" y="574" font-size="13" font-weight="700" fill="#1c2a24">基础设施</text>
    <text x="932" y="594" font-size="11.5" fill="#7a8a82">MyBatis-Plus 3.5：逻辑删除 · 分页插件</text>
    <text x="932" y="612" font-size="11.5" fill="#7a8a82">WebSocket 私信推送（在线秒达）</text>
    <text x="932" y="630" font-size="11.5" fill="#7a8a82">定时任务：待付款 30 分钟自动关单</text>
    <text x="932" y="648" font-size="11.5" fill="#7a8a82">统一响应 R{code,msg,data} · 全局异常</text>

    <!-- 持久层 -->
    <rect x="624" y="674" width="572" height="44" rx="10" fill="#1c2a24"/>
    <text x="648" y="702" font-size="13" font-weight="600" fill="#ffffff">持久层 · MyBatis-Plus Mapper → MySQL（12 张表，utf8mb4）</text>
  </g>

  <!-- ================= 数据与外部服务 ================= -->
  <g filter="url(#cardShadow)">
    <rect x="1244" y="150" width="292" height="640" rx="18" fill="#ffffff" stroke="#e3ebe6"/>
  </g>
  <rect x="1244" y="150" width="292" height="46" rx="18" fill="#f0f6f2"/>
  <rect x="1244" y="178" width="292" height="18" fill="#f0f6f2"/>
  <text x="1268" y="180" font-size="15" font-weight="700" fill="#0e7a50">数据与外部服务</text>

  <!-- MySQL -->
  <g>
    <rect x="1268" y="214" width="244" height="176" rx="12" fill="#f8faf9" stroke="#dce7e1"/>
    <text x="1290" y="240" font-size="14" font-weight="700" fill="#1c2a24">MySQL 8.x</text>
    <text x="1290" y="260" font-size="11.5" fill="#7a8a82">brix_campus · utf8mb4</text>
    <g font-size="11.5" fill="#4a5a52">
      <text x="1290" y="284">t_user  t_category  t_item</text>
      <text x="1290" y="304">t_item_image  t_item_comment</text>
      <text x="1290" y="324">t_order  t_review  t_favorite</text>
      <text x="1290" y="344">t_browse_history  t_report</text>
      <text x="1290" y="364">t_chat_message  t_ai_estimate_log</text>
    </g>
  </g>

  <!-- 文件存储 -->
  <g>
    <rect x="1268" y="406" width="244" height="98" rx="12" fill="#f8faf9" stroke="#dce7e1"/>
    <text x="1290" y="432" font-size="14" font-weight="700" fill="#1c2a24">本地文件存储</text>
    <text x="1290" y="452" font-size="11.5" fill="#7a8a82">backend/uploads/</text>
    <text x="1290" y="470" font-size="11.5" fill="#7a8a82">seed 主题图 · item 用户上传</text>
    <text x="1290" y="488" font-size="11.5" fill="#7a8a82">静态映射 /uploads/**</text>
  </g>

  <!-- LLM -->
  <g>
    <rect x="1268" y="520" width="244" height="98" rx="12" fill="#fdf7ef" stroke="#f2ddc0"/>
    <text x="1290" y="546" font-size="14" font-weight="700" fill="#b25e00">DeepSeek API</text>
    <text x="1290" y="566" font-size="11.5" fill="#8a6a45">deepseek-chat</text>
    <text x="1290" y="584" font-size="11.5" fill="#8a6a45">估价 / 文案 / 发布审核</text>
    <text x="1290" y="602" font-size="11.5" fill="#8a6a45">Key 由 AI_API_KEY 注入</text>
  </g>

  <!-- 说明 -->
  <g>
    <rect x="1268" y="634" width="244" height="120" rx="12" fill="#f6f9f7" stroke="#dce7e1"/>
    <text x="1290" y="658" font-size="12.5" font-weight="700" fill="#1c2a24">架构约束</text>
    <g font-size="11" fill="#7a8a82">
      <text x="1290" y="680">Long 全序列化为字符串</text>
      <text x="1290" y="698">业务失败 HTTP 仍 200</text>
      <text x="1290" y="716">防超卖：条件更新行数 CAS</text>
      <text x="1290" y="734">AI 故障自动降级，不阻断主流程</text>
    </g>
  </g>

  <!-- 连线 -->
  <g stroke="#8a9a92" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <path d="M424,450 L462,450"/>
    <path d="M568,450 L598,450"/>
    <path d="M1220,320 L1266,320" stroke-dasharray="5 4"/>
    <path d="M1220,455 L1266,455" stroke-dasharray="5 4"/>
    <path d="M1220,570 L1266,570" stroke-dasharray="5 4"/>
  </g>
  <g font-size="10.5" fill="#8a9a92">
    <text x="424" y="396">HTTP/JSON</text>
    
    <text x="1224" y="312">JDBC</text>
    <text x="1224" y="447">FS</text>
    <text x="1224" y="562">HTTPS</text>
  </g>

  <!-- 底注 -->
  <text x="64" y="852" font-size="12" fill="#8a9a92">答辩展示 · 架构总览：Client(Vue3) → Vite 代理 → Spring Boot 分层单体 → MySQL / 本地文件 / DeepSeek LLM</text>
</svg>
