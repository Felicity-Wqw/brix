<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="740" viewBox="0 0 1600 740"
     font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',sans-serif">
  <rect width="1600" height="740" fill="#ffffff"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#8a9a92" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="56" y="34" width="8" height="32" rx="4" fill="#0e7a50"/>
<text x="80" y="50" font-size="35" fill="#1c2a24" font-weight="700" text-anchor="start" dominant-baseline="central">AI 服务流程图</text>
<text x="80" y="86" font-size="16" fill="#8a9a92" font-weight="400" text-anchor="start" dominant-baseline="central">发布流程中的三个 AI 入口 · LangChain4j 手工装配 · 全链路可降级</text>
<text x="56" y="150" font-size="17" fill="#1c2a24" font-weight="700" text-anchor="start" dominant-baseline="central">业务入口（发布页）</text>
<rect x="56" y="168" width="300" height="76" rx="10" fill="#eef7f2" stroke="#cfe7db" stroke-width="1.4"/>
<text x="72" y="194" font-size="17" font-weight="700" fill="#0e7a50">① 帮我定价</text>
<text x="72" y="216" font-size="14" fill="#4a5a52">分类 · 型号 · 成色 · 原价（可空）</text>
<rect x="56" y="264" width="300" height="76" rx="10" fill="#eef7f2" stroke="#cfe7db" stroke-width="1.4"/>
<text x="72" y="290" font-size="17" font-weight="700" fill="#0e7a50">② 生成文案</text>
<text x="72" y="312" font-size="14" fill="#4a5a52">分类 · 型号 · 成色 · 亮点</text>
<rect x="56" y="360" width="300" height="76" rx="10" fill="#f6f9f7" stroke="#dce7e1" stroke-width="1.4"/>
<text x="72" y="386" font-size="17" font-weight="700" fill="#1c2a24">③ 提交上架 → 触发审核</text>
<text x="72" y="408" font-size="14" fill="#7a8a82">标题 · 描述 · 所属分类</text>
<text x="56" y="470" font-size="14" fill="#8a9a92" font-weight="400" text-anchor="start" dominant-baseline="central">三个入口都来自同一条发布流程</text>
<rect x="400" y="140" width="780" height="120" rx="10" fill="#f6f9f7" stroke="#dce7e1" stroke-width="1.4"/>
<text x="416" y="166" font-size="19" font-weight="700" fill="#1c2a24">AI 服务（进程内嵌 · 不是独立服务）</text>
<text x="416" y="188" font-size="14" fill="#7a8a82">Spring Boot 3.5 + LangChain4j 1.22 + DeepSeek</text>
<rect x="424" y="200" width="320" height="54" rx="10" fill="#eef7f2" stroke="#cfe7db" stroke-width="1.4"/>
<text x="440" y="212" font-size="17" font-weight="700" fill="#0e7a50">ChatModel → DeepSeek</text>
<text x="440" y="234" font-size="14" fill="#4a5a52">temperature 0.3 · 10s 超时 · 不重试</text>
<rect x="764" y="200" width="200" height="54" rx="10" fill="#eef7f2" stroke="#cfe7db" stroke-width="1.4"/>
<text x="780" y="212" font-size="17" font-weight="700" fill="#0e7a50">AiServices.builder</text>
<text x="780" y="234" font-size="14" fill="#4a5a52">接口 → 动态代理</text>
<rect x="984" y="200" width="172" height="54" rx="10" fill="#eef7f2" stroke="#cfe7db" stroke-width="1.4"/>
<text x="1000" y="212" font-size="17" font-weight="700" fill="#0e7a50">2 个智能体</text>
<text x="1000" y="234" font-size="14" fill="#4a5a52">估价 · 审核</text>
<text x="400" y="296" font-size="17" fill="#1c2a24" font-weight="700" text-anchor="start" dominant-baseline="central">三个能力（同一套装配，不同提示词与工具）</text>
<rect x="400" y="314" width="252" height="196" rx="10" fill="#eef7f2" stroke="#cfe7db" stroke-width="1.4"/>
<text x="416" y="340" font-size="17" font-weight="700" fill="#0e7a50">智能估价</text>
<text x="416" y="362" font-size="14" fill="#4a5a52">两阶段定价</text>
<text x="416" y="378" font-size="14" fill="#4a5a52" font-weight="400" text-anchor="start" dominant-baseline="central">锚点：原价 / LLM 新品价</text>
<text x="416" y="402" font-size="14" fill="#4a5a52" font-weight="400" text-anchor="start" dominant-baseline="central">工具：4 个 @Tool 查库</text>
<text x="416" y="426" font-size="14" fill="#4a5a52" font-weight="400" text-anchor="start" dominant-baseline="central">同款判定 → 清洗钳制</text>
<text x="416" y="456" font-size="14" fill="#8a9a92" font-weight="400" text-anchor="start" dominant-baseline="central">成交统计 · 中位数</text>
<text x="416" y="476" font-size="14" fill="#8a9a92" font-weight="400" text-anchor="start" dominant-baseline="central">在售最低价 · 折价系数</text>
<rect x="672" y="314" width="248" height="196" rx="10" fill="#eef7f2" stroke="#cfe7db" stroke-width="1.4"/>
<text x="688" y="340" font-size="17" font-weight="700" fill="#0e7a50">一键文案</text>
<text x="688" y="362" font-size="14" fill="#4a5a52">分类驱动</text>
<text x="688" y="378" font-size="14" fill="#4a5a52" font-weight="400" text-anchor="start" dominant-baseline="central">三段式：亮点/瑕疵/说明</text>
<text x="688" y="402" font-size="14" fill="#4a5a52" font-weight="400" text-anchor="start" dominant-baseline="central">按分类选卖点框架</text>
<text x="688" y="426" font-size="14" fill="#4a5a52" font-weight="400" text-anchor="start" dominant-baseline="central">内置合规红线过滤</text>
<text x="688" y="456" font-size="14" fill="#8a9a92" font-weight="400" text-anchor="start" dominant-baseline="central">标题 ≤24 字</text>
<text x="688" y="476" font-size="14" fill="#8a9a92" font-weight="400" text-anchor="start" dominant-baseline="central">标签 3~5 个</text>
<rect x="940" y="314" width="240" height="196" rx="10" fill="#eef7f2" stroke="#cfe7db" stroke-width="1.4"/>
<text x="956" y="340" font-size="17" font-weight="700" fill="#0e7a50">发布审核</text>
<text x="956" y="362" font-size="14" fill="#4a5a52">合规第二道闸</text>
<text x="956" y="378" font-size="14" fill="#4a5a52" font-weight="400" text-anchor="start" dominant-baseline="central">依据 9 部法规判定</text>
<text x="956" y="402" font-size="14" fill="#4a5a52" font-weight="400" text-anchor="start" dominant-baseline="central">四档：通过/禁售/</text>
<text x="956" y="426" font-size="14" fill="#4a5a52" font-weight="400" text-anchor="start" dominant-baseline="central">　　　改后重审/上报风控</text>
<text x="956" y="456" font-size="14" fill="#8a9a92" font-weight="400" text-anchor="start" dominant-baseline="central">无工具 · 单轮结构化</text>
<text x="956" y="476" font-size="14" fill="#8a9a92" font-weight="400" text-anchor="start" dominant-baseline="central">不占用户 AI 额度</text>
<text x="1210" y="150" font-size="17" fill="#1c2a24" font-weight="700" text-anchor="start" dominant-baseline="central">输出与兜底</text>
<rect x="1210" y="168" width="334" height="86" rx="10" fill="#eef7f2" stroke="#cfe7db" stroke-width="1.4"/>
<text x="1226" y="194" font-size="17" font-weight="700" fill="#0e7a50">结果清洗 Sanitizer</text>
<text x="1226" y="216" font-size="14" fill="#4a5a52">区间合法化 · 依据补足</text>
<text x="1226" y="232" font-size="14" fill="#0e7a50" font-weight="500" text-anchor="start" dominant-baseline="central">二手价 ≤ 原价 × 0.98 硬钳制</text>
<rect x="1210" y="272" width="334" height="76" rx="10" fill="#f6f9f7" stroke="#d9c4a8" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="1226" y="298" font-size="17" font-weight="700" fill="#1c2a24">结构化返回</text>
<text x="1226" y="320" font-size="14" fill="#7a8a82">价格 · 区间 · 置信度 · 依据</text>
<text x="1226" y="332" font-size="14" fill="#8a9a92" font-weight="400" text-anchor="start" dominant-baseline="central">reasons[] · riskTips[] · source</text>
<rect x="1210" y="366" width="334" height="144" rx="10" fill="#fdf7ef" stroke="#d9c4a8" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="1226" y="392" font-size="17" font-weight="700" fill="#b25e00">规则引擎降级（RuleBasedEstimator）</text>
<text x="1226" y="414" font-size="14" fill="#8a6a45">无 Key / 超时 / 解析失败 / 额度用尽</text>
<text x="1226" y="440" font-size="14" fill="#8a6a45" font-weight="400" text-anchor="start" dominant-baseline="central">分类基准价 × 成色 × 年限</text>
<text x="1226" y="462" font-size="14" fill="#8a6a45" font-weight="400" text-anchor="start" dominant-baseline="central">返回同一结构 · source = RULE</text>
<text x="1226" y="484" font-size="14" fill="#8a6a45" font-weight="400" text-anchor="start" dominant-baseline="central">置信度压到 0.6 以下并标注估算</text>
<rect x="56" y="556" width="1488" height="90" rx="12" fill="#1c2a24"/>
<text x="80" y="584" font-size="16" fill="#d6e6de" font-weight="400" text-anchor="start" dominant-baseline="central">额度：估价 + 文案共用 20 次/日 · 审核不计额度</text>
<text x="80" y="610" font-size="16" fill="#d6e6de" font-weight="400" text-anchor="start" dominant-baseline="central">日志：每次调用写入 t_ai_estimate_log（场景 / 来源 / 成功 / 耗时 / 脱敏摘要）</text>
<text x="80" y="634" font-size="16" fill="#d6e6de" font-weight="400" text-anchor="start" dominant-baseline="central">提示词：AiPrompts 常量类，规则编号化 —— 可评审、可追溯、可单条修改</text>
<text x="56" y="676" font-size="16" fill="#b25e00" font-weight="700" text-anchor="start" dominant-baseline="central">原则：AI 只做增强，不做依赖 —— 删除两个依赖与 Key，系统功能变笨但不会崩</text>
