<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1160" viewBox="0 0 800 580"
     font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',sans-serif">
  <rect width="800" height="580" fill="#ffffff"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#8a9a92" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="40" y="26" width="6" height="26" rx="3" fill="#0e7a50"/>
  <text x="58" y="40" font-size="22" font-weight="700" fill="#1c2a24" dominant-baseline="central">JWT 认证流程</text>
  <text x="58" y="66" font-size="12.5" fill="#8a9a92" dominant-baseline="central">登录态为什么不用 Session：token 自带签名，服务端零会话存储；每次查库换「封号即时生效」</text>
<rect x="40" y="96" width="280" height="56" rx="10" fill="#eef7f2" stroke="#cfe7db" stroke-width="0.6"/>
  <text x="180.0" y="115.0" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="600" fill="#1c2a24">浏览器发起请求</text>
  <text x="180.0" y="134.0" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#4a5a52">Authorization: Bearer token</text>
  <path d="M180 152 L180 191" fill="none" stroke="#8a9a92" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="40" y="196" width="280" height="56" rx="10" fill="#eef7f2" stroke="#cfe7db" stroke-width="0.6"/>
  <text x="180.0" y="215.0" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="600" fill="#1c2a24">JWT 过滤器拦截</text>
  <text x="180.0" y="234.0" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#4a5a52">读取请求头 token</text>
  <rect x="440" y="196" width="320" height="56" rx="10" fill="#f4f4f2" stroke="#dcdcd9" stroke-width="0.6"/>
  <text x="600.0" y="215.0" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="600" fill="#5f5e5a">没有 token</text>
  <text x="600.0" y="234.0" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#8a8a86">放行，由 URL 规则决定是否登录</text>
  <path d="M320 224 L435 224" fill="none" stroke="#8a9a92" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M180 252 L180 291" fill="none" stroke="#8a9a92" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="40" y="296" width="280" height="56" rx="10" fill="#eef7f2" stroke="#cfe7db" stroke-width="0.6"/>
  <text x="180.0" y="315.0" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="600" fill="#1c2a24">验签并取得 userId</text>
  <text x="180.0" y="334.0" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#4a5a52">过期 / 篡改 均解析失败</text>
  <rect x="440" y="302" width="320" height="44" rx="10" fill="#fdecea" stroke="#f7c1c1" stroke-width="0.6"/>
  <text x="600.0" y="324.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#b91c1c">解析失败 → 401，立即中断</text>
  <path d="M320 324 L435 324" fill="none" stroke="#8a9a92" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M180 352 L180 391" fill="none" stroke="#8a9a92" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="40" y="396" width="280" height="56" rx="10" fill="#eef7f2" stroke="#cfe7db" stroke-width="0.6"/>
  <text x="180.0" y="415.0" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="600" fill="#1c2a24">按主键查库校验</text>
  <text x="180.0" y="434.0" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#4a5a52">用户不存在 → 401</text>
  <rect x="440" y="402" width="320" height="44" rx="10" fill="#fdecea" stroke="#f7c1c1" stroke-width="0.6"/>
  <text x="600.0" y="424.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#b91c1c">账号已禁用 → 403</text>
  <path d="M320 424 L435 424" fill="none" stroke="#8a9a92" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M180 452 L180 491" fill="none" stroke="#8a9a92" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="40" y="496" width="280" height="56" rx="10" fill="#eef7f2" stroke="#cfe7db" stroke-width="0.6"/>
  <text x="180.0" y="515.0" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="600" fill="#1c2a24">写入 SecurityContext</text>
  <text x="180.0" y="534.0" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#4a5a52">控制器用 SecurityUtils 取当前用户</text>
</svg>